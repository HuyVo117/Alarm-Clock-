name: wake_up
description: "App báo thức Wake Up - giao diện kiểu iPhone"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Navigation
  go_router: ^18.1.0

  # Database
  drift: ^2.35.2
  drift_flutter: ^0.3.0

  # Alarm
  alarm: ^5.15.0
  flutter_alarmkit: ^0.5.0
  flutter_local_notifications: ^22.3.2

  # Localization
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  riverpod_generator: ^4.0.9

flutter:
  generate: true
  uses-material-design: true
